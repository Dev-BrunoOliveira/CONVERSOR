<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DINAConverter</title>

    <link rel="stylesheet" href="./CSS/reset.css" />
    <link rel="stylesheet" href="./CSS/reader.css" />
    <link rel="stylesheet" href="./CSS/footer.css" />
    <link rel="stylesheet" href="./CSS/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>DINAConverter</h1>
    </header>

    <div>
      <img src="./img/LOGOSITE.png" alt="logosite" class="logo"/>
    </div>

    <main>
      <form id="form">
        <section class="inputs-container">
          <div class="form-group">
            <label for="value-real">Valor a ser convertido (R$)</label>
            <input
              type="number"
              placeholder="20,00"
              id="value-real"
              name="value-real"
              max="1000000"
            />
          </div>

          <div class="form-group">
            <label for="currency">Escolha a Moeda</label>
            <select id="currency">
              <option value="">Selecione...</option>
              <option value="eur">Euro</option>
              <option value="dol">Dólar</option>
            </select>
          </div>
        </section>
        <button type="submit">Converter</button>
      </form>
      <h2 id="result"></h2>
    </main>

    <footer>
      <span> &copy; DINAConverter, 2024. Todos os direitos reservados. </span>
    </footer>
  </body>
  <script src="script.js"></script>
</html>
